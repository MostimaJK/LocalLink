appId: com.orbit.desktop
productName: LocalLink
directories:
  output: dist/

publish: null

files:
  - "**/*"
  - "!dist/**"
  - "!.agent/**"
  - "!.github/**"
  - "!android/**"
  - "!tests/**"
  - "!test-results/**"
  - "!playwright-report/**"
  - "!.gemini/**"

# shared/ lives OUTSIDE the app directory (desktop/), so `files` cannot reach it.
# The renderer loads ../../shared/* from desktop/src/ and the main process
# requires ../shared/crypto/* — both resolve to resources/shared at runtime.
# Without this, every shared/ module 404s in packaged builds.
extraResources:
  - from: ../LICENSE
    to: licenses/Orbit-LICENSE.txt
  - from: ../shared
    to: shared

# --- Windows ---
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/icons/app/locallink.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# --- macOS ---
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: src/icons/app/locallink.png
  category: public.app-category.utilities
  darkModeSupport: true

dmg:
  title: "LocalLink ${version}"
  artifactName: "LocalLink-${version}-${arch}.dmg"

# --- Linux ---
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: src/icons/app/locallink.png
  category: Network;FileTransfer
  synopsis: "Private device-to-device file transfer"
  description: "Local network file transfer with a chronological device conversation."

appImage:
  artifactName: "LocalLink-${version}-${arch}.AppImage"

deb:
  artifactName: "LocalLink-${version}-${arch}.deb"
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
